# ── Prefix ──────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Performance ─────────────────────────────────────────
set -g escape-time 0
set -g history-limit 200000
set -g focus-events on

# ── Indexing ────────────────────────────────────────────
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

# ── Mouse ──────────────────────────────────────────────
set -g mouse on
set -g word-separators " \t!\"#$%&'()*+,:;<=>?@[\\]^`{|}~"

# Exit copy-mode when scrolling hits bottom
bind -T copy-mode-vi WheelDownPane send-keys -X -N 3 scroll-down \; if-shell -F "#{==:#{scroll_position},0}" "send-keys -X cancel" ""

# ── Session groups (studio + iterm) ────────────────────
set -g window-size latest

# ── Terminal capabilities (truecolor, undercurl, etc.) ─
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:Tc"
set -as terminal-overrides ",tmux-256color:Tc"
set -as terminal-features ",*:RGB:strikethrough:undercurl:clipboard:focus:extkeys"
setenv -g COLORTERM "truecolor"

# ── Extended keys (tmux 3.5) ───────────────────────────
set -g extended-keys always
set -g extended-keys-format csi-u

# ── Clipboard (OSC 52 — works over SSH + ttyd) ─────────
set -g set-clipboard external
set -wg mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe
bind -T copy-mode-vi Enter send-keys -X copy-pipe

# ── Windows ────────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"
set -g automatic-rename on
set -g automatic-rename-format '#{?#{m/r:^(/google/src)?/cloud/,#{pane_current_path}},#{s|^(/google/src)?/cloud/[^/]+/([^/]+).+$|\2|:pane_current_path},#{b:pane_current_path}}'

# ── Pane splitting (keep current path) ─────────────────
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"

# ── Navigation (vim-like) ──────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r C-h previous-window
bind -r C-l next-window

# ── Pane resize ────────────────────────────────────────
bind -r M-h resize-pane -L 5
bind -r M-j resize-pane -D 5
bind -r M-k resize-pane -U 5
bind -r M-l resize-pane -R 5

# ── Display ────────────────────────────────────────────
set -g set-titles on
set -g set-titles-string "#T"
set -g allow-passthrough on
set -g status-interval 5

# ── Activity monitoring ────────────────────────────────
set -g activity-action other
set -g visual-activity off
set -wg monitor-activity on
set -wg monitor-bell on
