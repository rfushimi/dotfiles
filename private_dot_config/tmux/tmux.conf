# Prefix Key: Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# Enable mouse mode
set -g mouse on

# Enable 256 colors and RGB color
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*256color*:RGB"
setenv -g COLORTERM "truecolor"

# 新しいウィンドウ(c)を、現在のペインのパス(-c "#{pane_current_path}")で開く
bind-key c new-window -c "#{pane_current_path}"

set -g automatic-rename on
set -g automatic-rename-format '#{?#{m/r:^(/google/src)?/cloud/,#{pane_current_path}},#{s|^(/google/src)?/cloud/[^/]+/([^/]+).+$|\2|:pane_current_path},#{b:pane_current_path}}'

# macOS clipboard integration (requires pbcopy on the client side)
# This setup assumes you have a way to pipe to the Mac's pbcopy,
# often involving SSH's RemoteCommand or iTerm2's utilities.
# For iTerm2 integration, this might not be strictly necessary
# as iTerm2 can handle clipboard management.

# Basic copy-paste bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# Scroll wheel support
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t =; copy-mode -e; send-keys -M'"
bind -n WheelDownPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t =; copy-mode -e; send-keys -M'"

